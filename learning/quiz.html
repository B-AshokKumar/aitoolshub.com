<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lesson Quiz - AI Learning Hub</title>

<link rel="stylesheet" href="css/learning.css">

</head>

<body>

<header class="header">

    <div class="logo">
        📝 Lesson Quiz
    </div>

    <a href="javascript:history.back()" class="home-btn">

        <svg class="back-icon" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>

        <span>Back</span>

    </a>

</header>

<div class="lesson-container">

    <h1 id="quizTitle">
        Loading Quiz...
    </h1>

    <p id="quizProgress" class="lesson-progress"></p>

    <div id="quizContainer">

        <h2 id="question"></h2>

        <div id="answers"></div>

    </div>

</div>

<script src="js/quiz.js"></script>

</body>

</html>
