<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Lesson - AI Learning Hub</title>

<link rel="stylesheet" href="css/learning.css">

</head>

<body>

<header class="header">

<div class="logo">

📘 AI Lesson

</div>

<a href="study.html" class="home-btn">

⬅ Back

</a>

</header>

<div class="lesson-container">

<h1 id="lessonTitle">

Loading...

</h1>

<p class="lesson-category">

<span id="lessonCategory"></span>

</p>

<p id="lessonProgress" class="lesson-progress"></p>

<div id="lessonContent"
class="lesson-content">

Loading lesson...

</div>

<div class="lesson-buttons">

<button id="prevBtn">

    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">

        <polyline points="15 18 9 12 15 6"></polyline>

    </svg>

    <span>Previous</span>

</button>

<button id="nextBtn">

    <span>Next</span>

    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">

        <polyline points="9 18 15 12 9 6"></polyline>

    </svg>

</button>

</div>

</div>

<script src="data/ai-basics.js"></script>
<script src="data/topics.js"></script>
  
<script src="js/lesson.js"></script>

<div class="scroll-buttons">

    <button id="scrollTopBtn" title="Scroll to Top" aria-label="Scroll to Top">

        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>

    </button>

</div>

<script src="js/scroll.js"></script>

</body>

</html>
